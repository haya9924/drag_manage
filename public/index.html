<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <meta name="description" content="服薬記録・在庫・残日数・服薬時刻の通知をまとめて管理するセルフホスト型アプリ">
    <title>服薬管理</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle'%3E%F0%9F%92%8A%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="brand">
                <span class="brand-icon" aria-hidden="true">💊</span>
                <div>
                    <h1>服薬管理</h1>
                    <p id="today-label" class="today-label">読み込み中…</p>
                </div>
            </div>
            <button id="notify-btn" class="ghost small" type="button" title="服薬時刻のブラウザ通知を有効にします">
                通知を有効に
            </button>
        </header>

        <main>
            <!-- 今日 -->
            <section id="view-today" class="view" aria-labelledby="tab-today">
                <div id="today-stats" class="stat-grid" aria-live="polite"></div>
                <div id="alerts" class="alert-list"></div>

                <section class="card">
                    <div class="card-head">
                        <h2>今日の服薬</h2>
                        <span id="today-count" class="muted"></span>
                    </div>
                    <div id="today-list" class="dose-list"></div>
                    <div id="today-extra" class="today-extra"></div>
                </section>
            </section>

            <!-- お薬 -->
            <section id="view-meds" class="view hidden" aria-labelledby="tab-meds">
                <div class="section-head">
                    <h2>お薬と在庫</h2>
                    <button id="add-med-btn" class="primary small" type="button">＋ お薬を追加</button>
                </div>
                <div id="med-list" class="med-list"></div>
            </section>

            <!-- 履歴 -->
            <section id="view-history" class="view hidden" aria-labelledby="tab-history">
                <section class="card">
                    <div class="card-head">
                        <h2>服用履歴</h2>
                        <label class="inline-select">
                            期間
                            <select id="history-days">
                                <option value="7">7日</option>
                                <option value="30" selected>30日</option>
                                <option value="90">90日</option>
                            </select>
                        </label>
                    </div>
                    <div id="history-list" class="dose-list history-list"></div>
                </section>

                <section class="card">
                    <div class="card-head"><h2>購入履歴</h2></div>
                    <div id="purchase-list" class="plain-list"></div>
                </section>

                <section class="card">
                    <div class="card-head"><h2>残数修正</h2></div>
                    <div id="adjustment-list" class="plain-list"></div>
                </section>
            </section>
        </main>

        <nav class="tabbar" aria-label="画面切り替え">
            <button id="tab-today" class="tab active" type="button" data-tab="today">
                <span aria-hidden="true">☀️</span><span>今日</span>
            </button>
            <button id="tab-meds" class="tab" type="button" data-tab="meds">
                <span aria-hidden="true">💊</span><span>お薬</span>
            </button>
            <button id="tab-history" class="tab" type="button" data-tab="history">
                <span aria-hidden="true">📋</span><span>履歴</span>
            </button>
        </nav>
    </div>

    <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="false"></div>

    <!-- お薬の追加・編集 -->
    <dialog id="med-dialog" class="sheet">
        <form id="med-form" class="form" novalidate>
            <div class="sheet-head">
                <h2 id="med-title">お薬を追加</h2>
                <button type="button" class="icon-btn" data-close aria-label="閉じる">×</button>
            </div>
            <input type="hidden" id="med-id">
            <label class="field">
                <span>お薬の名前 <em>*</em></span>
                <input id="med-name" type="text" maxlength="100" required placeholder="例: ロキソニン">
            </label>
            <div class="row">
                <label class="field">
                    <span>1回量</span>
                    <input id="med-dose" type="number" min="0.01" step="0.01" value="1" inputmode="decimal">
                </label>
                <label class="field">
                    <span>単位</span>
                    <input id="med-unit" type="text" maxlength="20" value="錠" placeholder="錠 / mL">
                </label>
            </div>
            <label class="field">
                <span>服薬時刻 <small>カンマ区切り（空欄なら頓服）</small></span>
                <input id="med-times" type="text" placeholder="08:00, 20:00" autocomplete="off">
            </label>
            <label id="med-schedule-edit-row" class="check hidden">
                <input id="med-schedule-edit" type="checkbox">
                <span>服薬予定（時刻・曜日・予定の1回量）もこの内容で更新する</span>
            </label>
            <p id="med-schedule-note" class="form-note hidden"></p>
            <div class="field">
                <span>曜日</span>
                <div id="weekdays" class="weekdays">
                    <label class="wd"><input type="checkbox" value="0" checked><span>月</span></label>
                    <label class="wd"><input type="checkbox" value="1" checked><span>火</span></label>
                    <label class="wd"><input type="checkbox" value="2" checked><span>水</span></label>
                    <label class="wd"><input type="checkbox" value="3" checked><span>木</span></label>
                    <label class="wd"><input type="checkbox" value="4" checked><span>金</span></label>
                    <label class="wd"><input type="checkbox" value="5" checked><span>土</span></label>
                    <label class="wd"><input type="checkbox" value="6" checked><span>日</span></label>
                </div>
            </div>
            <div class="row">
                <label class="field">
                    <span>残数アラート（日分）</span>
                    <input id="med-low" type="number" min="0" max="3650" step="1" value="7" inputmode="numeric">
                </label>
                <label class="field color-field">
                    <span>色</span>
                    <input id="med-color" type="color" value="#0f766e">
                </label>
            </div>
            <label class="check">
                <input id="med-notify" type="checkbox" checked>
                <span>服薬時刻になったら通知する</span>
            </label>
            <label class="field">
                <span>メモ</span>
                <textarea id="med-note" rows="2" maxlength="1000" placeholder="食後、水と一緒に など"></textarea>
            </label>
            <p id="med-error" class="form-error" hidden></p>
            <div class="sheet-actions">
                <button id="med-deactivate" class="ghost danger small hidden" type="button">服用予定を停止</button>
                <span class="spacer"></span>
                <button type="button" class="ghost" data-close>キャンセル</button>
                <button type="submit" class="primary">保存</button>
            </div>
        </form>
    </dialog>

    <!-- 購入追加 -->
    <dialog id="purchase-dialog" class="sheet">
        <form id="purchase-form" class="form" novalidate>
            <div class="sheet-head">
                <h2>購入を追加</h2>
                <button type="button" class="icon-btn" data-close aria-label="閉じる">×</button>
            </div>
            <input type="hidden" id="purchase-med-id">
            <p id="purchase-med-name" class="sheet-sub"></p>
            <label class="field">
                <span>購入数 <em>*</em></span>
                <input id="purchase-qty" type="number" min="0.01" step="0.01" required inputmode="decimal">
            </label>
            <div class="row">
                <label class="field">
                    <span>購入日</span>
                    <input id="purchase-date" type="date" required>
                </label>
                <label class="field">
                    <span>金額（任意）</span>
                    <input id="purchase-price" type="number" min="0" step="1" inputmode="numeric" placeholder="円">
                </label>
            </div>
            <label class="field">
                <span>メモ</span>
                <input id="purchase-note" type="text" maxlength="500" placeholder="例: 1箱 / 薬局">
            </label>
            <div class="sheet-actions">
                <span class="spacer"></span>
                <button type="button" class="ghost" data-close>キャンセル</button>
                <button type="submit" class="primary">追加</button>
            </div>
        </form>
    </dialog>

    <!-- 残数修正 -->
    <dialog id="adjust-dialog" class="sheet">
        <form id="adjust-form" class="form" novalidate>
            <div class="sheet-head">
                <h2>残数を修正</h2>
                <button type="button" class="icon-btn" data-close aria-label="閉じる">×</button>
            </div>
            <input type="hidden" id="adjust-med-id">
            <p id="adjust-med-name" class="sheet-sub"></p>
            <p class="sheet-note">現在の残数: <strong id="adjust-stock"></strong></p>
            <label class="field">
                <span>増減 <em>*</em> <small>減らすならマイナス</small></span>
                <input id="adjust-delta" type="number" step="0.01" required inputmode="decimal" placeholder="例: -3">
            </label>
            <label class="field">
                <span>理由</span>
                <input id="adjust-reason" type="text" maxlength="500" placeholder="棚卸し / 紛失 など">
            </label>
            <div class="sheet-actions">
                <span class="spacer"></span>
                <button type="button" class="ghost" data-close>キャンセル</button>
                <button type="submit" class="primary">修正する</button>
            </div>
        </form>
    </dialog>

    <script src="/app.js"></script>
</body>
</html>
